<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>RT-JPN-OCR</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#111;color:#eee;font-family:sans-serif;-webkit-tap-highlight-color:transparent}
#bar{position:sticky;top:0;padding:10px 12px;background:#000;display:flex;gap:8px;align-items:center;z-index:5}
#dot{width:10px;height:10px;border-radius:50%;background:#f33;flex:none}
#dot.ok{background:#0f0}
#st{font-size:.85rem;color:#aaa;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar button{background:#222;color:#fff;border:1px solid #444;border-radius:8px;padding:8px 10px;font-size:1rem}
#histbar{display:none;gap:6px;padding:8px 12px;background:#0a0a0a;flex-wrap:wrap;align-items:center}
#histbar.on{display:flex}
#menu{display:none;gap:6px;padding:8px 12px;background:#0a0a0a;flex-wrap:wrap;align-items:center}
#menu.on{display:flex}
#menu button{background:#1a1a1a;color:#ccc;border:1px solid #333;border-radius:8px;padding:8px 10px;font-size:.85rem}
#trans-model{display:none;font-size:.7rem;color:#666;padding:0 18px}
#histbar button{background:#1a1a1a;color:#ccc;border:1px solid #333;border-radius:8px;padding:6px 8px;font-size:.8rem}
#histbar button.act{background:#333;color:#fff;border-color:#8ab4ff}
#hist{display:none;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
#hist.on{display:flex}
.chip{background:#1a1a1a;color:#ccc;border:1px solid #333;border-radius:8px;padding:6px 8px;font-size:.8rem;max-width:46vw;display:flex;gap:6px;align-items:center}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.chip .dt{color:#8ab4ff;flex:none}
.chip .stale{color:#fa0;flex:none}
.chip button{background:none;border:0;color:#888;font-size:.9rem;padding:0 2px}
.chip button.fav-on{color:#fd0}
#sent{font-size:2rem;line-height:2.8rem;padding:18px 18px 4px;word-break:break-all;min-height:30vh}
#trans{display:none;font-size:1.15rem;line-height:1.7rem;padding:4px 18px 18px;color:#bcd;font-style:italic}
ruby{cursor:pointer;border-bottom:1px solid #444;padding:0 1px}
ruby:hover{background:#222}
ruby.sus{border-bottom:2px solid #fa0}
#edited-tag{display:none;font-size:.8rem;color:#fd0;padding:0 18px}
rt{font-size:.9rem;color:#8ab4ff}
#card{position:fixed;left:8px;right:8px;bottom:8px;background:#1e1e1e;border:1px solid #444;border-radius:12px;padding:14px;display:none;max-height:55vh;overflow:auto;box-shadow:0 8px 30px #000;z-index:10}
#card h2{margin:0;font-size:1.6rem}
#card .rd{color:#8ab4ff;margin:4px 0;font-size:1.2rem}
#card li{margin:4px 0 4px 18px}
#card .row{display:flex;gap:8px;align-items:center}
#card button{background:#333;color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:1rem}
footer{padding:12px;color:#666;font-size:.7rem;text-align:center}
</style>
</head>
<body>
<div id="bar"><div id="dot"></div><span id="st">connecting…</span>
<button id="b-cam" title="Capture on PC">📸</button>
<button id="b-say" title="Read sentence aloud">🔊</button>
<button id="b-hist" title="History">🕘</button>
<button id="b-menu" title="Settings">⚙️</button>
</div>
<div id="menu">
<button id="m-be" title="OCR engine (tap to cycle)">OCR: R</button>
<button id="m-tm" title="Translation model (tap to cycle)">MT: qwen</button>
<button id="m-key" title="API key">🔑 key</button>
</div>
<div id="histbar">
<button id="s-desc" class="act">Date ↓</button>
<button id="s-asc">Date ↑</button>
<button id="s-fav">⭐ Starred</button>
<select id="s-page" title="Per page">
<option value="10">10</option>
<option value="20" selected>20</option>
<option value="50">50</option>
</select>
<button id="pg-prev">‹</button><span id="pg-info"></span><button id="pg-next">›</button>
<button id="s-clear" style="margin-left:auto">🗑 All</button>
</div>
<div id="hist"></div>
<div id="sent">Waiting for capture… (PC hotkey, 📸 button, or photo to the bot)</div>
<div id="edited-tag">✏️ edited by hand</div>
<div id="trans"></div>
<div id="trans-model"></div>
<div id="card"><div class="row"><button id="c-say">🔊</button><h2 id="c-w"></h2>
<button id="c-fav" title="Star (protects from auto-delete)">☆</button>
<button id="c-edit" title="Edit this word">✏️</button>
<button id="c-x" style="margin-left:auto">✕</button></div>
<div class="rd" id="c-r"></div><ol id="c-g"></ol></div>
<footer>Dictionary data: JMdict/EDRDG © CC BY-SA — <span id="cnt"></span></footer>
<script>
/* Store: IndexedDB 100MB, full cache {id,ts,text,result,v,fav,translation}.
   LRU eviction skips starred. Policy isolated in evict() so it can
   change without touching the UI. */
const DB="rt-jpn-ocr", MAX_BYTES=100*1024*1024, MAX_ENTRIES=500;
let TOKS=[], CUR=null, CUR_I=-1, CUR_ENTRY=null, CUR_ID=null, GEN=null, PAGE=0;
const BES=["tesseract","rapidocr","groq"], BEL={tesseract:"T",rapidocr:"R",groq:"G",manual:"✏️"};
const TMS=["qwen/qwen3.8-27b","openai/gpt-oss-120b","openai/gpt-oss-20b"];
const TML={"qwen/qwen3.8-27b":"qwen","openai/gpt-oss-120b":"120b","openai/gpt-oss-20b":"20b"};
const CONF_THRESH=0.85; // líneas bajo esto se subrayan como sospechosas
let pref={sort:"desc",favOnly:false,pageSize:20,backend:"rapidocr",apiKey:"",
  tmodel:"qwen/qwen3.8-27b"};
try{Object.assign(pref,JSON.parse(localStorage.getItem("rtjpn-pref")||"{}"))}catch(e){}
if(![10,20,50].includes(pref.pageSize))pref.pageSize=20;
if(!BES.includes(pref.backend))pref.backend="rapidocr";
if(!TMS.includes(pref.tmodel))pref.tmodel=TMS[0];
const $=id=>document.getElementById(id);
const wsProto=location.protocol==="https:"?"wss":"ws";
function savePref(){try{localStorage.setItem("rtjpn-pref",JSON.stringify(pref))}catch(e){}}
function say(t){try{speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";u.rate=0.9;
  speechSynthesis.speak(u);}catch(e){}}
/* Japanese dates for immersion (年月日 + 曜日 days).
   Raw numeric ts untouched: ordering uses ts, not the string. */
const YOUBI=["日","月","火","水","木","金","土"];
const P2=n=>String(n).padStart(2,"0");
function fmtShort(ts){const d=new Date(ts);
  return `${P2(d.getMonth()+1)}/${P2(d.getDate())} ${P2(d.getHours())}:${P2(d.getMinutes())}`;}
function fmtFull(ts){const d=new Date(ts);
  return `${d.getFullYear()}年${P2(d.getMonth()+1)}月${P2(d.getDate())}日 `+
    `${P2(d.getHours())}:${P2(d.getMinutes())}(${YOUBI[d.getDay()]})`;}
/* ---- IndexedDB ---- */
let _db=null;
function db(){return new Promise((res,rej)=>{
  if(_db)return res(_db);
  const rq=indexedDB.open(DB,1);
  rq.onupgradeneeded=e=>{const d=e.target.result;
    const s=d.createObjectStore("history",{keyPath:"id"});
    s.createIndex("ts","ts",{unique:false});s.createIndex("fav","fav",{unique:false});};
  rq.onsuccess=e=>{_db=e.target.result;res(_db);};
  rq.onerror=e=>rej(e);});}
function tx(mode,fn){return db().then(d=>new Promise((res,rej)=>{
  const t=d.transaction("history",mode),s=t.objectStore("history"),rq=fn(s);
  t.oncomplete=()=>res(rq&&rq.result);t.onerror=e=>rej(e);}));}
async function evict(){
  // LRU: delete oldest non-starred until under quota AND under
  // MAX_ENTRIES. If all starred, don't delete, warn.
  // Raw ts untouched: only whole records are deleted.
  const all0=await tx("readonly",s=>s.index("ts").getAll());
  let over = all0.filter(r=>!r.fav);
  if(all0.length>MAX_ENTRIES){
    for(const r of all0){ // ts asc: viejas primero
      if(all0.length<=MAX_ENTRIES)break;
      if(r.fav)continue;
      await tx("readwrite",s=>s.delete(r.id));
      all0.splice(all0.indexOf(r),1);
    }
  }
  let usage=0; try{const e=await navigator.storage.estimate();usage=e.usage||0;}catch(err){}
  if(usage<MAX_BYTES)return;
  const all=await tx("readonly",s=>s.index("ts").getAll());
  let freed=false;
  for(const r of all){ // ts asc: viejas primero
    if(r.fav)continue;
    await tx("readwrite",s=>s.delete(r.id)); freed=true;
    try{const e2=await navigator.storage.estimate();if((e2.usage||0)<MAX_BYTES)break;}catch(e2){break;}
  }
  if(!freed)$("st").textContent="history full (all starred)";
}
async function saveEntry(d,extra){
  extra=extra||{};
  const e={id:Date.now()+""+Math.floor(Math.random()*1e4),ts:Date.now(),
    text:d.text,tokens:d.tokens,v:d.v||null,translation:d.translation||null,
    backend:d.backend||null,ocr_by:d.ocr_by||null,ms:d.ms,ocr_ms:d.ocr_ms,
    dict_ms:d.dict_ms,psm:d.psm,line_conf:d.line_conf||null,
    edited:!!extra.edited,orig_text:extra.orig_text||null,
    parent:extra.parent||null,rid:d.id||null,fav:false};
  await tx("readwrite",s=>s.add(e));
  try{await evict()}catch(err){}
  CUR_ENTRY=e; return e;
}
async function listEntries(){
  let all=await tx("readonly",s=>s.index("ts").getAll());
  if(pref.favOnly)all=all.filter(r=>r.fav);
  all.sort((a,b)=>pref.sort==="asc"?a.ts-b.ts:b.ts-a.ts);
  return all;
}
/* ---- render ---- */
function paintTrans(t){
  const el=$("trans");
  if(t){el.textContent=t;el.style.display="block";}
  else{el.textContent="";el.style.display="none";}
}
function render(d,entry){
  if(!d||!d.tokens)return;
  TOKS=d.tokens; GEN=d.v||GEN;
  if(entry)CUR_ENTRY=entry;
  if(d.rid)CUR_ID=d.rid;else if(d.id)CUR_ID=d.id;
  $("sent").innerHTML="";
  const confs=d.line_conf||[];
  let li=0;
  TOKS.forEach((t,i)=>{
    if(t.br){li++;$("sent").appendChild(document.createElement("br"));return;}
    const r=document.createElement("ruby");
    r.textContent=t.surface;
    if(t.reading&&t.reading!==t.surface){
      const rt=document.createElement("rt");rt.textContent=t.reading;r.appendChild(rt);}
    const cf=confs[li];
    if(cf!=null&&cf<CONF_THRESH)r.className="sus"; // low-confidence line
    r.onclick=()=>show(i);$("sent").appendChild(r);});
  paintTrans(d.translation);
  $("trans-model").textContent=""; // model unknown until tap-to-cycle regen
  $("edited-tag").style.display=d.edited?"block":"none";
  const by=d.ocr_by==="pc"?" · PC":(d.ocr_by==="pi"?" · Pi":
    (d.ocr_by?` · ${d.ocr_by}`:""));
  $("st").textContent=(d.edited?"✏️ ":"")+(d.text?d.text.slice(0,44):"no text")+
    (d.backend?` [${BEL[d.backend]||"?"}]`:"")+by+
    (d.ms!=null?` ${d.ms}ms`:"");
  $("cnt").textContent=(d.ocr_ms!=null?`ocr ${d.ocr_ms} + dict ${d.dict_ms}ms`:"")+
    (d.psm?` · psm${d.psm}`:"");
}
async function onTrans(m){ // phase 2: {id, translation} merges into view + history
  if(!m||!m.id||!m.translation)return;
  if(CUR_ID&&m.id!==CUR_ID)return;
  paintTrans(m.translation);
  $("trans-model").textContent=""; // auto winner unknown; tap translation to pick
  if(CUR_ENTRY){CUR_ENTRY.translation=m.translation;
    try{await tx("readwrite",s=>s.put(CUR_ENTRY))}catch(e){}}
}
function show(i){
  const t=TOKS[i];if(!t||t.br)return;CUR=t;CUR_I=i;
  $("c-w").textContent=t.lemma||t.surface;
  $("c-r").textContent=t.reading||"";
  $("c-g").innerHTML=(t.glosses&&t.glosses.length?t.glosses:["—"])
    .map(g=>`<li>${String(g).replace(/</g,"&lt;")}</li>`).join("");
  paintFav();
  $("card").style.display="block";
}
function paintFav(){$("c-fav").textContent=(CUR_ENTRY&&CUR_ENTRY.fav)?"★":"☆";}
async function drawHist(){
  const h=$("hist");h.innerHTML="";
  let all=[];try{all=await listEntries()}catch(e){return;}
  const total=all.length, pages=Math.max(1,Math.ceil(total/pref.pageSize));
  if(PAGE>pages-1)PAGE=pages-1;
  const slice=all.slice(PAGE*pref.pageSize,(PAGE+1)*pref.pageSize);
  $("pg-info").textContent=`${PAGE+1}/${pages} (${total})`;
  $("s-page").value=String(pref.pageSize);
  slice.forEach(r=>{
    const c=document.createElement("div");c.className="chip";
    c.title=fmtFull(r.ts); // full Japanese date in tooltip
    const stale=GEN&&r.v&&r.v!==GEN;
    c.innerHTML=`<span class="dt">${fmtShort(r.ts)}</span>`+
      (r.edited?`<span class="stale" title="hand-edited">✏️</span>`:"")+
      (stale?`<span class="stale" title="engine changed since saved">↻</span>`:"")+
      `<span class="t">${String(r.text).slice(0,30).replace(/</g,"&lt;")}</span>`;
    const bf=document.createElement("button");
    bf.textContent=r.fav?"★":"☆";if(r.fav)bf.className="fav-on";
    bf.title="Star (protects from auto-delete)";bf.onclick=async ev=>{ev.stopPropagation();
      r.fav=!r.fav;await tx("readwrite",s=>s.put(r));
      if(CUR_ENTRY&&CUR_ENTRY.id===r.id)CUR_ENTRY.fav=r.fav;
      paintFav();drawHist();};
    const bd=document.createElement("button");bd.textContent="✕";bd.title="delete";
    bd.onclick=async ev=>{ev.stopPropagation();
      if(r.fav){alert("Unstar it first");return;}
      await tx("readwrite",s=>s.delete(r.id));drawHist();};
    // tap = exact cached copy, offline, no server
    c.onclick=()=>{render(r,r)};
    c.appendChild(bf);c.appendChild(bd);h.appendChild(c);});
  $("s-desc").className=pref.sort==="desc"?"act":"";
  $("s-asc").className=pref.sort==="asc"?"act":"";
  $("s-fav").className=pref.favOnly?"act":"";
}
async function onLive(d,extra){
  if(!d||!d.tokens||!d.text)return;
  if(d.id)CUR_ID=d.id;
  render(d);
  try{await saveEntry(d,extra);PAGE=0;drawHist();}catch(e){}
}
/* ---- manual correction: token ✏️ + long-press sentence ---- */
let PENDING_ORIG=null; // {parent, text} attached to next onLive from /api/correct
function toksToText(){
  return TOKS.map(t=>t.br?"\n":(t.surface||"")).join("");
}
async function postCorrect(text,parentId,origText){
  if(!text)return;
  $("st").textContent="correcting…";
  try{
    const r=await fetch("/api/correct",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text,key:pref.apiKey||"",parent_id:parentId||null})});
    if(r.status===401){alert("wrong key (🔑 button)");return;}
    if(!r.ok){alert("correct failed: "+r.status);return;}
    PENDING_ORIG={parent:parentId,text:origText};
  }catch(e){$("st").textContent="correct failed";}
}
const _origOnLive=onLive;
onLive=async function(d,extra){
  extra=extra||{};
  if(d.edited&&PENDING_ORIG&&PENDING_ORIG.parent===d.parent){
    extra.orig_text=PENDING_ORIG.text;extra.edited=true;extra.parent=d.parent;
    PENDING_ORIG=null;
  } else if(d.edited){extra.edited=true;}
  await _origOnLive(d,extra);
};
$("c-edit").onclick=()=>{
  if(!CUR||CUR_I<0)return;
  const v=prompt("Correct this word:",CUR.surface||"");
  if(v===null||v===CUR.surface)return;
  const parts=TOKS.map(t=>t.br?"\n":(t.surface||""));
  let ti=0;
  for(let i=0;i<TOKS.length;i++){
    if(TOKS[i].br)continue;
    if(i===CUR_I){parts[i]=v;break;}
  }
  postCorrect(parts.join(""),CUR_ENTRY?CUR_ENTRY.id:null,toksToText());
};
let _lpT=null;
$("sent").addEventListener("touchstart",()=>{
  _lpT=setTimeout(()=>{
    const cur=toksToText();if(!cur)return;
    const v=prompt("Correct the sentence:",cur);
    if(v===null||v===cur)return;
    postCorrect(v,CUR_ENTRY?CUR_ENTRY.id:null,cur);
  },650);},{passive:true});
$("sent").addEventListener("touchend",()=>clearTimeout(_lpT));
$("sent").addEventListener("dblclick",()=>{
  const cur=toksToText();if(!cur)return;
  const v=prompt("Correct the sentence:",cur);
  if(v===null||v===cur)return;
  postCorrect(v,CUR_ENTRY?CUR_ENTRY.id:null,cur);
});
$("c-x").onclick=()=>$("card").style.display="none";
$("c-say").onclick=()=>{if(CUR)say(CUR.surface)};
$("c-fav").onclick=async()=>{
  if(!CUR_ENTRY)return;
  CUR_ENTRY.fav=!CUR_ENTRY.fav;
  try{await tx("readwrite",s=>s.put(CUR_ENTRY))}catch(e){}
  paintFav();drawHist();};
$("b-say").onclick=()=>{const s=TOKS.filter(t=>t.surface).map(t=>t.surface).join("");
  if(s)say(s);};
function paintBe(){$("m-be").textContent="OCR: "+(BEL[pref.backend]||"?");}
$("m-be").onclick=()=>{pref.backend=BES[(BES.indexOf(pref.backend)+1)%BES.length];
  savePref();paintBe();};
$("m-key").onclick=()=>{ // key = same API_KEY as the Pi (POSTs only)
  const v=prompt("API key (same as API_KEY on the Pi, empty = no auth):",pref.apiKey||"");
  if(v===null)return;
  pref.apiKey=v.trim();savePref();
  $("st").textContent=pref.apiKey?"key saved":"no key";};
function paintTm(){$("m-tm").textContent="MT: "+(TML[pref.tmodel]||"?");}
$("m-tm").onclick=()=>{pref.tmodel=TMS[(TMS.indexOf(pref.tmodel)+1)%TMS.length];
  savePref();paintTm();};
async function regenTranslation(){ // tap on translation = next model + regenerate
  const txt=CUR_ENTRY?CUR_ENTRY.text:toksToText();
  if(!txt)return;
  pref.tmodel=TMS[(TMS.indexOf(pref.tmodel)+1)%TMS.length];
  savePref();paintTm();
  $("trans-model").textContent="via "+(TML[pref.tmodel]||"?")+"…";
  try{
    const t=await (await fetch(`/api/translate?text=${encodeURIComponent(txt)}&model=${encodeURIComponent(pref.tmodel)}`)).json();
    if(t.translation){paintTrans(t.translation);
      $("trans-model").textContent="via "+(TML[pref.tmodel]||pref.tmodel);
      if(CUR_ENTRY){CUR_ENTRY.translation=t.translation;
        try{await tx("readwrite",s=>s.put(CUR_ENTRY))}catch(e){}}}
    else{$("trans-model").textContent="model failed, try again";}
  }catch(e){$("trans-model").textContent="model failed, try again";}
}
$("trans").onclick=()=>regenTranslation();
$("b-menu").onclick=()=>{$("menu").classList.toggle("on");};
$("b-cam").onclick=()=>{ // 📸 ask the PC to capture (via Pi proxy)
  $("st").textContent="capturing…";
  const q=`backend=${pref.backend}`+(pref.apiKey?`&key=${encodeURIComponent(pref.apiKey)}`:"");
  fetch(`/api/disparar?${q}`,{method:"POST"})
    .then(async r=>{
      if(r.status===401)throw new Error("401: wrong key (🔑 button)");
      if(r.status===502)throw new Error("502: PC unreachable");
      if(!r.ok)throw new Error(r.status);})
    .catch(e=>{$("st").textContent=String(e.message||e).replace("Error: ","");});};
paintBe();paintTm();
$("b-hist").onclick=()=>{const on=$("hist").classList.toggle("on");
  $("histbar").classList.toggle("on",on);if(on)drawHist();};
$("s-desc").onclick=()=>{pref.sort="desc";PAGE=0;savePref();drawHist();};
$("s-asc").onclick=()=>{pref.sort="asc";PAGE=0;savePref();drawHist();};
$("s-fav").onclick=()=>{pref.favOnly=!pref.favOnly;PAGE=0;savePref();drawHist();};
$("s-page").onchange=e=>{pref.pageSize=parseInt(e.target.value,10)||20;PAGE=0;savePref();drawHist();};
$("pg-prev").onclick=()=>{if(PAGE>0){PAGE--;drawHist();}};
$("pg-next").onclick=async()=>{const a=await listEntries();
  if((PAGE+1)*pref.pageSize<a.length){PAGE++;drawHist();}};
$("s-clear").onclick=async()=>{ // skips starred, with confirmation
  if(!confirm("Delete non-starred history?"))return;
  const all=await tx("readonly",s=>s.getAll());
  for(const r of all){if(!r.fav)await tx("readwrite",s=>s.delete(r.id));}
  PAGE=0;drawHist();};
/* ---- WS ---- */
function conn(){
  const ws=new WebSocket(`${wsProto}://${location.host}/ws`);
  ws.onopen=()=>{$("dot").className="ok";$("st").textContent="connected";$("cnt").textContent="live";};
  ws.onclose=()=>{$("dot").className="";$("st").textContent="reconnecting…";setTimeout(conn,2000);};
  ws.onerror=()=>{try{ws.close()}catch(e){}};
  ws.onmessage=e=>{try{const m=JSON.parse(e.data);
    if(m.tokens)onLive(m);else onTrans(m);}catch(err){}};
}
fetch("/api/health").then(r=>r.json()).then(h=>{if(h&&h.gen)GEN=h.gen}).catch(()=>{});
fetch("/api/last").then(r=>r.json()).then(d=>{if(d&&d.tokens&&d.tokens.length)onLive(d)}).catch(()=>{});
if("wakeLock"in navigator){const lock=()=>{try{navigator.wakeLock.request("screen")}catch(e){}};
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)lock()});lock();}
conn();
</script>
</body>
</html>
